<!DOCTYPE html>
<html>
<head>
  <title>Batu Terara Hotel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <h1>🏨 Batu Terara Hotel</h1>
  <p>Luxury Stay • Comfort • Excellence</p>
</header>

<section class="booking">
  <h2>Book a Room</h2>

  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">

  <input type="date" id="checkin">
  <input type="date" id="checkout">

  <select id="room">
    <option>Standard - $50</option>
    <option>Deluxe - $80</option>
    <option>VIP Suite - $150</option>
  </select>

  <button onclick="bookRoom()">Book Now</button>

  <p id="msg"></p>
</section>

<section class="info">
  <h2>Hotel Services</h2>
  <p>🍽 Restaurant | 📶 WiFi | 🚗 Parking | 🛎 24/7 Service | 🧖 Spa</p>
</section>

<script src="app.js"></script>
</body>
  </html>

<!DOCTYPE html>
<html>
<head>
  <title>Batu Terara Hotel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <h1>🏨 Batu Terara Hotel</h1>
  <p>Luxury Stay • Comfort • Excellence</p>
</header>

<section class="booking">
  <h2>Book a Room</h2>

  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">

  <input type="date" id="checkin">
  <input type="date" id="checkout">

  <select id="room">
    <option>Standard Room – 500 ETB / Night</option>
    <option>Deluxe Room – 700 ETB / Night</option>
  </select>

  <button onclick="bookRoom()">Book Now</button>

  <p id="msg"></p>
</section>

<section class="info">
  <h2>Hotel Services</h2>
  <p>🍽 Restaurant | 📶 Free WiFi | 🚗 Parking | 🛎 24/7 Room Service | 🧹 Daily Housekeeping</p>
</section>

<footer>
  <p>© 2026 Batu Terara Hotel. All Rights Reserved.</p>
</footer>

<script src="app.js"></script>

</body>
</html>
